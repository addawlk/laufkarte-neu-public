<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Laufroute Köln</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
*{box-sizing:border-box}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.95) saturate(.5)}
html,body{height:100%;margin:0;background:#12151c;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#map{position:absolute;inset:0;background:#12151c}
.panel{position:absolute;z-index:1000;left:12px;bottom:12px;width:calc(100% - 24px);max-width:400px;background:rgba(18,21,28,.93);border:1px solid #2a3040;border-radius:16px;padding:14px;box-sizing:border-box}
h1{font-size:1.05rem;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
input[type=number],input[type=text]{background:#1d222d;border:1px solid #2f3647;color:#fff;border-radius:8px;padding:9px;font:inherit;min-width:0}
input[type=number]{width:90px}
button,a.btn{flex:1;text-align:center;font:inherit;font-weight:600;background:#1d222d;border:1px solid #2f3647;color:#fff;border-radius:8px;padding:10px;cursor:pointer;text-decoration:none}
button.p{background:#fc4c02;border-color:#fc4c02}
#info{font-size:.9rem;color:#b8c0d0;min-height:1.2em}
details{font-size:.82rem;color:#b8c0d0;margin-top:6px}details a{color:#fc4c02}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h1>🏃 Laufroute Köln</h1>
<div class="row"><input type="text" id="addr" placeholder="Startadresse, z. B. Straße Nr., Köln" style="flex:1" autocomplete="street-address"></div>
<div class="row"><input type="text" id="via" placeholder="Gebiet/Park, durch das du laufen willst (optional)" style="flex:1"></div>
<div class="row"><label>Distanz</label><input type="number" id="dist" value="8" min="1" max="40" step="0.5" inputmode="decimal"> km
<button class="p" id="go">Route erstellen</button></div>
<div class="row"><button id="again">🔄 Neue Variante</button><a class="btn" id="gm" target="_blank" rel="noopener" style="display:none">Google Maps</a></div>
<div id="info"></div>
<details id="kd"><summary>API-Schlüssel (kostenlos, einmalig)</summary>
<p>Für die Routenberechnung wird ein kostenloser Schlüssel von <a href="https://openrouteservice.org/dev/#/signup" target="_blank" rel="noopener">openrouteservice.org</a> benötigt.</p>
<div class="row"><input type="text" id="key" placeholder="Schlüssel einfügen" style="flex:1"><button id="save" style="flex:0 0 auto">Speichern</button></div>
</details>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const CENTER=[6.9583,50.9413];
const ORS="https://api.openrouteservice.org";
const $=id=>document.getElementById(id);
let key="",addr="",start=null,seed=1,layer=null,marker=null;
let viaText="",viaPt=null,viaMarker=null;
try{key=localStorage.getItem("ors_key")||"";addr=localStorage.getItem("start_addr")||"";$("via").value=localStorage.getItem("via_text")||""}catch(e){}
$("addr").value=addr;
if(!key)$("kd").open=true;
const map=L.map("map",{zoomControl:false}).setView([CENTER[1],CENTER[0]],13);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap-Mitwirkende"}).addTo(map);
L.control.zoom({position:"topright"}).addTo(map);

$("save").onclick=()=>{key=$("key").value.trim();try{localStorage.setItem("ors_key",key)}catch(e){}
 $("info").textContent=key?"Schlüssel gespeichert.":"Kein Schlüssel eingegeben.";if(key){$("kd").open=false;run()}};

const HBF={type:"Polygon",coordinates:[[[6.9590,50.9400],[6.9628,50.9400],[6.9628,50.9436],[6.9590,50.9436],[6.9590,50.9400]]]};
const toR=Math.PI/180;
const dist=(a,b)=>{const dl=(b[1]-a[1])*toR,dn=(b[0]-a[0])*toR,h=Math.sin(dl/2)**2+Math.cos(a[1]*toR)*Math.cos(b[1]*toR)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const bearing=(a,b)=>(Math.atan2((b[0]-a[0])*Math.cos(a[1]*toR),b[1]-a[1])/toR+360)%360;
const offset=(p,br,km)=>[p[0]+km*Math.sin(br*toR)/(111.32*Math.cos(p[1]*toR)),p[1]+km*Math.cos(br*toR)/111.32];

async function geocode(text){
 const r=await fetch(`${ORS}/geocode/search?api_key=${encodeURIComponent(key)}&text=${encodeURIComponent(text)}&boundary.country=DE&focus.point.lon=6.96&focus.point.lat=50.94&size=1`);
 const j=await r.json();
 if(!j.features||!j.features.length)throw new Error("nicht gefunden");
 return j.features[0].geometry.coordinates;
}
// Fähren sind immer ausgeschlossen
async function ors(coords,extra){
 const o=Object.assign({avoid_features:["ferries"],avoid_polygons:HBF},extra||{});
 const r=await fetch(`${ORS}/v2/directions/foot-walking/geojson`,{method:"POST",
  headers:{"Authorization":key,"Content-Type":"application/json"},
  body:JSON.stringify({coordinates:coords,radiuses:coords.map(()=>1500),options:o})});
 const j=await r.json();
 if(!j.features)throw new Error(j.error&&j.error.message||"Keine Route gefunden");
 return j.features[0];
}
// Rundkurs, der durch das Wunschgebiet führt
async function viaRoute(s,v,D){
 const a=dist(s,v),h=bearing(s,v);
 if(1.3*2*a>=0.85*D)return ors([s,v,s]);
 const side=seed%2?1:-1,ang=[90,65,40][Math.floor((seed-1)/2)%3];
 for(const sd of [side,-side]){
  let x=0.2,w;
  for(;x<D;x+=0.1){w=offset(v,h+sd*ang,x);if(1.3*(a+x+dist(w,s))>=D)break}
  try{return await ors([s,v,w,s])}catch(e){}
 }
 return ors([s,v,s]);
}

async function run(){
 if(!key){$("kd").open=true;$("info").textContent="Bitte zuerst den kostenlosen Schlüssel eintragen.";return}
 const km=parseFloat($("dist").value);
 if(!(km>0)){$("info").textContent="Bitte eine Distanz eingeben.";return}
 const a=$("addr").value.trim(),v=$("via").value.trim();
 if(!a){$("info").textContent="Bitte eine Startadresse eingeben.";return}
 $("info").textContent="Route wird berechnet …";
 try{
  if(a!==addr||!start){addr=a;start=null;if(marker){map.removeLayer(marker);marker=null}
   try{localStorage.setItem("start_addr",addr)}catch(e){}
   try{start=await geocode(addr)}catch(e){throw new Error("Startadresse nicht gefunden")}
   marker=L.circleMarker([start[1],start[0]],{radius:8,color:"#fff",weight:3,fillColor:"#3b82f6",fillOpacity:1}).addTo(map)}
  if(v!==viaText||(v&&!viaPt)){viaText=v;viaPt=null;if(viaMarker){map.removeLayer(viaMarker);viaMarker=null}
   try{localStorage.setItem("via_text",v)}catch(e){}
   if(v){try{viaPt=await geocode(/köln/i.test(v)?v:v+", Köln")}catch(e){throw new Error("Gebiet „"+v+"“ nicht gefunden")}
    viaMarker=L.circleMarker([viaPt[1],viaPt[0]],{radius:7,color:"#fff",weight:2,fillColor:"#fc4c02",fillOpacity:1}).addTo(map)}}
  const feat=viaPt?await viaRoute(start,viaPt,km):await ors([start],{round_trip:{length:km*1000,points:4,seed}});
  const c=feat.geometry.coordinates,ll=c.map(p=>[p[1],p[0]]);
  if(layer)map.removeLayer(layer);
  layer=L.layerGroup([
   L.polyline(ll,{color:"#fc4c02",weight:14,opacity:.18}),
   L.polyline(ll,{color:"#fc4c02",weight:7,opacity:.4}),
   L.polyline(ll,{color:"#ffd2bf",weight:3,opacity:1})
  ]).addTo(map);
  marker.bringToFront();if(viaMarker)viaMarker.bringToFront();
  map.fitBounds(L.latLngBounds(ll),{padding:[40,40]});
  const d=feat.properties.summary.distance/1000;
  $("info").textContent=`${d.toFixed(1).replace(".",",")} km · ca. ${Math.round(d*6)} min bei 6:00/km`+(viaPt?" · über "+viaText:"")+" · ohne Fähren";
  const n=8,wp=[];for(let i=1;i<=n;i++){const p=c[Math.floor(i*c.length/(n+1))];wp.push(p[1].toFixed(5)+","+p[0].toFixed(5))}
  const g=$("gm");g.style.display="block";
  g.href="https://www.google.com/maps/dir/?api=1&travelmode=walking&origin="+encodeURIComponent(addr)+"&destination="+encodeURIComponent(addr)+"&waypoints="+encodeURIComponent(wp.join("|"));
 }catch(e){$("info").textContent="Fehler: "+e.message}
}
$("go").onclick=()=>{seed=1;run()};
$("again").onclick=()=>{seed++;run()};
if(key&&addr)run();
</script>
</body>
</html>
